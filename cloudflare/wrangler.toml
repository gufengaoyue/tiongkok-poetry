name = "molan-verse-archive"
main = "worker.js"
compatibility_date = "2025-11-01"

# 前端构建产物由 Workers Static Assets 托管。
# directory 相对本配置文件所在目录解析。
[assets]
directory = "../web/dist"
binding = "ASSETS"
not_found_handling = "single-page-application"

# 免费方案：正文全部是静态资源；D1 只存单字/高频二元组检索索引。
# 先执行 `wrangler d1 create molan-search`，把返回的 database_id 填到下面。
[[d1_databases]]
binding = "DB"
database_name = "molan-search"
database_id = "6b3f3d09-1f41-4db4-8637-d0a9f54fca97"
